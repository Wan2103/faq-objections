<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Collection - EviNDT</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <h1>Template Collection Form</h1>

    <!-- NAV -->
    <div class="nav">
        <a href="index.html">Home</a>
        <a href="faq.html">FAQs</a>
        <a href="objections.html">Objections</a>
        <a href="demo-script.html">Demo Script</a>
        <a href="template-form.html" class="active">Templates</a>
    </div>

    <!-- USER INFO -->
    <div class="form-section">
        <h2>1. User Information</h2>

        <input id="company" placeholder="Prospect / Company">
        <input id="userRole" placeholder="User Role">
        <input id="reportType" placeholder="Report Type">
        <input id="currentTool" placeholder="Current Reporting Tool">
        <textarea id="mainPain" placeholder="Main Pain"></textarea>
    </div>

    <!-- TEMPLATE SECTION -->
    <div class="form-section">
        <h2>2. Template Collection</h2>

        <label>Does user have template?</label>
        <select id="hasTemplate">
            <option value="">Select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>

        <p style="margin-top:10px;color:#666;">
            If YES → upload PDF/DOCX template<br>
            If NO → only submit user info
        </p>

        <input type="file"
               id="templateFile"
               accept=".pdf,.docx">
    </div>

    <!-- ACTION -->
    <div class="form-section">
        <h2>3. Submit</h2>

        <div class="button-group">
            <button class="btn-primary" onclick="submitTemplateForm()">
                Save to System
            </button>
        </div>
    </div>

</div>

<script src="js/template-form.js"></script>

</body>
</html>
