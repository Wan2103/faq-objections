<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Template Builder - EviNDT</title>

    <link rel="stylesheet" href="css/style.css"/>
</head>

<body>

<div class="container">

    <h1>📄 Template Builder</h1>

    <!-- MODE SECTION -->
    <div class="form-section">
        <h2>Template Mode</h2>

        <label>Do you already have a template?</label>
        <select id="hasTemplate">
            <option value="yes">Yes (Upload my template)</option>
            <option value="no">No (Use system templates)</option>
        </select>

        <div id="uploadSection">
            <label>Upload Template (PDF / DOCX only)</label>
            <input type="file" id="templateFile" accept=".pdf,.docx"/>
        </div>

        <div id="generateSection" class="hidden">
            <label>Generate Template Name</label>
            <input type="text" id="templateName" placeholder="e.g. UT Report Template"/>
            <button class="btn-secondary" id="generateBtn">Generate Template</button>
        </div>
    </div>

    <!-- STRUCTURE SECTION -->
    <div class="form-section">
        <h2>Report Structure Filter</h2>

        <div class="checkbox-grid">
            <label><input type="checkbox" class="structure" value="header"> Header</label>
            <label><input type="checkbox" class="structure" value="client"> Client Info</label>
            <label><input type="checkbox" class="structure" value="inspection"> Inspection</label>
            <label><input type="checkbox" class="structure" value="photos"> Photos</label>
            <label><input type="checkbox" class="structure" value="findings"> Findings</label>
            <label><input type="checkbox" class="structure" value="recommendations"> Recommendations</label>
            <label><input type="checkbox" class="structure" value="signoff"> Sign-off</label>
        </div>
    </div>

    <!-- TEMPLATE LIBRARY -->
    <div class="form-section hidden" id="libraryCard">
        <h2>Template Library</h2>

        <label>Select Template</label>
        <select id="templateList"></select>

        <div class="preview-box" id="templatePreview">
            Select a template to preview...
        </div>

        <div class="button-group">
            <button id="useTemplateBtn">Use Template</button>
        </div>
    </div>

    <!-- ACTIONS -->
    <div class="form-section">
        <h2>Actions</h2>

        <div class="button-group">
            <button class="btn-primary" id="saveBtn">Save Template</button>
            <button class="btn-success" id="pdfBtn">Download PDF</button>
            <button class="btn-success" id="docxBtn">Download DOCX</button>
        </div>
    </div>

</div>

<script src="js/template-form.js"></script>
</body>
</html>
