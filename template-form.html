<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Template Collection - EviNDT</title>

    <link rel="stylesheet" href="css/style.css"/>
</head>

<body>

<div class="container">

    <h1>📄 Template Collection Form</h1>

    <!-- =========================
         1. USER INFO
    ========================== -->
    <div class="form-section">
        <h2>1. User Information</h2>

        <label>Prospect / Company</label>
        <input type="text" id="company" placeholder="Enter company name">

        <label>User Role</label>
        <input type="text" id="role" placeholder="e.g. QA Engineer, Inspector">

        <label>Report Type</label>
        <select id="reportType">
            <option>UT Report</option>
            <option>RT Report</option>
            <option>MT Report</option>
            <option>PT Report</option>
            <option>Visual Inspection</option>
        </select>

        <label>Current Reporting Tool</label>
        <input type="text" id="tool" placeholder="e.g. Excel, Word, Manual">

        <label>Main Pain</label>
        <textarea id="pain" placeholder="What is the main issue?"></textarea>
    </div>

    <!-- =========================
         2. TEMPLATE COLLECTION
    ========================== -->
    <div class="form-section">
        <h2>2. Template Collection</h2>

        <label>Do you have a template?</label>
        <select id="hasTemplate">
            <option value="no">No</option>
            <option value="yes">Yes</option>
        </select>

        <!-- NO TEMPLATE -->
        <div id="noTemplateSection">
            <p>No template selected. You can proceed to export your info.</p>
        </div>

        <!-- YES TEMPLATE (UPLOAD) -->
        <div id="yesTemplateSection" class="hidden">

            <label>Upload Template (PDF / DOCX only)</label>

            <div class="upload-box" id="dropArea">
                <p>📁 Drag & Drop your file here</p>
                <p>or click to upload</p>
                <input type="file" id="templateFile" accept=".pdf,.docx" hidden>
            </div>

        </div>
    </div>

    <!-- =========================
         3. EXPORT
    ========================== -->
    <div class="form-section">
        <h2>3. Export</h2>

        <p>Download all collected information as a PDF file.</p>

        <div class="button-group">
            <button class="btn-primary" id="exportPdfBtn">
                ⬇ Download PDF
            </button>
        </div>
    </div>

</div>
